<div class="layout-container" [class.sidebar-collapsed]="!isSidebarOpen">
  
  <!-- BARRA LATERAL -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Vida & Salud</h2>
    </div>

    <nav class="sidebar-menu">
      <ul>
        <li *ngFor="let item of allowedMenuItems">
          <a [routerLink]="item.route" routerLinkActive="active" title="{{ item.label }}">
            <i class="bi {{ item.icon }} icon"></i>
            <span class="label" *ngIf="isSidebarOpen">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <!-- Botón de hamburguesa movido aquí -->
        <button class="toggle-btn" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <span class="greeting">Hola, <strong>{{ userName }}</strong></span>
      </div>

      <div class="topbar-right">
        <span class="badge">{{ userRole }}</span>
        <button class="logout-btn" (click)="cerrarSesion()">Cerrar Sesión</button>
      </div>
    </header>

    
    <!-- AVISO DE SESIÓN PRÓXIMA A VENCER -->
    <div
      class="session-warning"
      *ngIf="sessionWarning$ | async"
      role="alert"
    >

      <div class="session-warning-icon">
        <i class="bi bi-clock-history"></i>
      </div>

      <div class="session-warning-content">

        <strong>Tu sesión está por vencer</strong>

        <span>
          Se cerrará en

          <strong>
            {{
              formatearTiempoSesion(
                sessionSecondsRemaining$ | async
              )
            }}
          </strong>.

          Guarda o termina la operación que estás realizando.
          Tendrás que iniciar sesión nuevamente.
        </span>

      </div>

      <button
        type="button"
        class="session-warning-close"
        (click)="ocultarAvisoSesion()"
        aria-label="Cerrar aviso"
      >
        <i class="bi bi-x-lg"></i>
      </button>

    </div>

    <div class="content-area">
      <router-outlet></router-outlet> <!-- Aquí se cargan los módulos -->
    </div>
  </main>

</div>
