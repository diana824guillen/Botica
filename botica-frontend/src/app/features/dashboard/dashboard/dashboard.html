
<div class="dashboard-container">

  <div class="welcome-header">

    <h1>¡Bienvenida de nuevo!</h1>

    <p class="text-muted">
      Selecciona una opción del menú lateral para comenzar
      a gestionar tu botica.
    </p>

  </div>

  <!-- TARJETAS SEGÚN LOS PERMISOS DEL PERFIL -->
  <div
    class="info-cards"
    *ngIf="mostrarTarjetas"
  >

    <!-- PRODUCTOS -->
    <div
      class="card"
      *ngIf="puedeVerProductos"
    >

      <i class="bi bi-capsule icon"></i>

      <h3>Productos</h3>

      <p>
        Gestiona tu catálogo, precios y presentaciones.
      </p>

    </div>

    <!-- PUNTO DE VENTA -->
    <div
      class="card"
      *ngIf="puedeRegistrarVenta"
    >

      <i class="bi bi-cart-check icon"></i>

      <h3>Nueva Venta</h3>

      <p>
        Registra ventas de forma rápida y aplica descuentos.
      </p>

    </div>

    <!-- CLIENTES -->
    <div
      class="card"
      *ngIf="puedeVerClientes"
    >

      <i class="bi bi-people icon"></i>

      <h3>Clientes</h3>

      <p>
        Administra tu base de clientes y consulta su historial.
      </p>

    </div>

  </div>

</div>
