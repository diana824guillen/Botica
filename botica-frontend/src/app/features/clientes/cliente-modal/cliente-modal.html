<div class="modal-backdrop">
  <div class="modal-card card">
    
    <div class="modal-header">
      <h3>{{ clienteEditar ? 'Editar Cliente' : 'Registrar Nuevo Cliente' }}</h3>
      <button class="close-btn" (click)="cerrar.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form [formGroup]="clienteForm" (ngSubmit)="guardar()">
      
      <!-- Toggle solo en creación -->
      <div class="modo-container" *ngIf="!clienteEditar">
        <label class="radio-label">
          <input type="radio" name="modo" value="AUTO" [checked]="modoRegistro === 'AUTO'" (change)="cambiarModo('AUTO')">
          <span>Buscar en RENIEC</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="modo" value="MANUAL" [checked]="modoRegistro === 'MANUAL'" (change)="cambiarModo('MANUAL')">
          <span>Registro Manual</span>
        </label>
      </div>

      <!-- Aviso si está bloqueado por RENIEC -->
      <div class="info-banner" *ngIf="esEdicionAuto">
        <i class="bi bi-info-circle"></i> Los nombres y apellidos fueron validados por RENIEC y no pueden ser modificados.
      </div>

      <div class="form-row">
        <div class="form-group col-4">
          <label>Tipo Doc. <span class="required">*</span></label>
          <select formControlName="tipoDocumento">
            <option value="DNI">DNI</option>
            <option value="CE">Carné de Extranjería</option>
            <option value="PASAPORTE">Pasaporte</option>
          </select>
        </div>

        <div class="form-group col-8">
          <label>Número de Documento <span class="required">*</span></label>
          <input 
            type="text" 
            formControlName="numeroDocumento" 
            (input)="onInputDocumento($event)"
            placeholder="Ej. 12345678">
          <span class="error-text" *ngIf="clienteForm.get('numeroDocumento')?.invalid && clienteForm.get('numeroDocumento')?.touched">
            Documento inválido para el tipo seleccionado.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Nombres <span class="required" *ngIf="modoRegistro === 'MANUAL' || esEdicionAuto">*</span></label>
        <input 
          type="text" 
          formControlName="nombres" 
          (input)="onInputNombre($event, 'nombres')"
          placeholder="Nombres del cliente">
      </div>

      <div class="form-group">
        <label>Apellidos <span class="required" *ngIf="modoRegistro === 'MANUAL' || esEdicionAuto">*</span></label>
        <input 
          type="text" 
          formControlName="apellidos" 
          (input)="onInputNombre($event, 'apellidos')"
          placeholder="Apellidos del cliente">
      </div>

      <div class="form-group">
        <label>Correo Electrónico (Opcional)</label>
        <input type="email" formControlName="correo" placeholder="ejemplo@correo.com">
        <span class="error-text" *ngIf="clienteForm.get('correo')?.invalid && clienteForm.get('correo')?.touched">
          Ingrese un correo válido.
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="clienteForm.invalid || isLoading">
          {{ isLoading ? 'Guardando...' : 'Guardar Cliente' }}
        </button>
      </div>

    </form>
  </div>
</div>
